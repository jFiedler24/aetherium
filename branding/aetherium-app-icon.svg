<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#181c2e"/>
      <stop offset="55%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>

    <!-- Outer Border / Edge Highlight -->
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Terminal Prompt / Core Accent Gradient -->
    <linearGradient id="etherCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Rust / SSH Warp Beam Gradient -->
    <linearGradient id="tunnelPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Dynamic Neon Glow Filter -->
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Tile (macOS/Modern Desktop Curvature: r=112) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#edgeGlow)" stroke-width="2.5"/>

  <!-- Subtle Inner Grid (Technical / Terminal Matrix Pattern) -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="16" x2="80" y2="496"/>
    <line x1="160" y1="16" x2="160" y2="496"/>
    <line x1="240" y1="16" x2="240" y2="496"/>
    <line x1="320" y1="16" x2="320" y2="496"/>
    <line x1="400" y1="16" x2="400" y2="496"/>
    <line x1="16" y1="80" x2="496" y2="80"/>
    <line x1="16" y1="160" x2="496" y2="160"/>
    <line x1="16" y1="240" x2="496" y2="240"/>
    <line x1="16" y1="320" x2="496" y2="320"/>
    <line x1="16" y1="400" x2="496" y2="400"/>
  </g>

  <!-- Concentric Orbital Nodes (SSH Handshake / Tunnel Layers) -->
  <ellipse cx="256" cy="256" rx="170" ry="85" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 14" opacity="0.25" transform="rotate(-25 256 256)"/>
  <ellipse cx="256" cy="256" rx="195" ry="98" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 16" opacity="0.2" transform="rotate(35 256 256)"/>

  <!-- Glowing Central Core: Stylized Diamond / Terminal Nexus -->
  <path d="M 256 108 L 138 344 L 176 344 L 256 182 L 336 344 L 374 344 Z"
        fill="url(#tunnelPurple)"
        opacity="0.22"
        filter="url(#softGlow)"/>

  <!-- Native Terminal Glyph: Prompt Chevron '>' Fused into an Ethereal Beam -->
  <path d="M 188 190 L 272 256 L 188 322"
        fill="none"
        stroke="url(#etherCyan)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neon)"/>

  <!-- Terminal Cursor / SSH Tunnel Pulse Line '_' -->
  <line x1="294" y1="322" x2="352" y2="322"
        stroke="#38bdf8"
        stroke-width="26"
        stroke-linecap="round"
        filter="url(#neon)"/>

  <!-- Apex Secure Node (SSH Lock Keypoint) -->
  <circle cx="256" cy="120" r="10" fill="#38bdf8" filter="url(#neon)"/>
  <circle cx="256" cy="120" r="4" fill="#ffffff"/>

  <!-- Subtle Status LED (Connected / Listening) -->
  <circle cx="72" cy="72" r="5" fill="#10b981" opacity="0.85"/>
  <circle cx="72" cy="72" r="9" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
</svg>
