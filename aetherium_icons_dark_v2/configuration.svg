<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <defs>
    <linearGradient id="aetherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#B388FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Ethereal Diamond with Dark Background Fill -->
  <path d="M50 6 L94 50 L50 94 L6 50 Z" fill="#0A0A10" stroke="url(#aetherGrad)" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Inner Framework -->
  <path d="M50 22 L78 50 L50 78 L22 50 Z" fill="#14141E" stroke="#B388FF" stroke-width="2" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Icon Core -->
  <g filter="url(#glow)">
    
    <path d="M50 34 A 16 16 0 1 0 50 66 A 16 16 0 1 0 50 34 Z" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M50 22 L50 30 M50 70 L50 78 M22 50 L30 50 M70 50 L78 50 M30 30 L36 36 M70 70 L64 64 M30 70 L36 64 M70 30 L64 36" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    
  </g>
</svg>