[package]
name = "aetherium"
version = "0.1.0"
edition = "2021"

[dependencies]
# x11 deps only compile on Linux, windows-manifest only acts on Windows,
# so one feature set covers all three desktop platforms.
gpui = { version = "0.2.2", default-features = false, features = ["x11", "windows-manifest"] }
russh = "0.63.3"
russh-sftp = "3.0.0"
alacritty_terminal = "0.26.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
anyhow = "1"
regex = "1"
parking_lot = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

[profile.dev]
opt-level = 1
