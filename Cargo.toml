[package]
name = "aetherium"
version = "0.1.9"
edition = "2021"
build = "build.rs"

[dependencies]
# x11 deps only compile on Linux, windows-manifest only acts on Windows,
# so one feature set covers all three desktop platforms.
gpui = { git = "https://github.com/zed-industries/zed.git", branch = "main", default-features = false, features = ["x11", "windows-manifest", "font-kit"] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", branch = "main", features = ["font-kit", "x11"] }
russh = "0.63.3"
russh-sftp = "3.0.0"
alacritty_terminal = "0.26.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "7"
anyhow = "1"
log = "0.4"
regex = "1"
parking_lot = "0.12"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[build-dependencies]
# Requirements tracing: scans `[impl->req~…~1]` tags in src/ and the
# markdown specs in docs/requirements/, then writes an HTML coverage
# report to target/. Set OVFT_STRICT=1 to fail the build on defects.
ovft-core = "0.1"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[profile.dev]
opt-level = 1
